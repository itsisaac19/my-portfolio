    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add("js");
        try {
          if (!sessionStorage.getItem("it-seen")) d.classList.add("first-visit");
          if (sessionStorage.getItem("it-wipe")) {
            d.classList.add("is-arriving");
            sessionStorage.removeItem("it-wipe");
          }
        } catch (e) {}
      })();
    </script>
